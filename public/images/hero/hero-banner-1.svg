<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" />
    </pattern>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Full Width Background -->
  <rect width="1920" height="680" fill="url(#bannerBg1)" />
  <rect width="1920" height="680" fill="url(#dotPattern)" opacity="0.4" />

  <!-- Subtle Minimal Brand Mark (embedded in banner design) -->
  <g transform="translate(140, 160)">
    <rect x="0" y="0" width="180" height="32" rx="4" fill="#334155" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="2">PAKISTAN COLLECTION</text>
    
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">100% PURE COMBED COTTON</text>
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="500" fill="#94A3B8">Everyday Hosiery &amp; Innerwear Essentials</text>
    
    <rect x="0" y="225" width="80" height="4" fill="#CA8A04" />
    <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#CBD5E1">Breathable Weave • Reinforced Seams • S to XXL</text>
  </g>

  <!-- Right Visual Presentation (Vest Mannequin Illustration) -->
  <g transform="translate(1250, 40)" filter="url(#softGlow)">
    <!-- Stack of premium folded garments -->
    <g transform="translate(200, 380)">
      <rect x="0" y="80" width="360" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
      <rect x="0" y="40" width="360" height="45" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
      <rect x="0" y="0" width="360" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
      <text x="24" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">AMIN RAISAT HOSIERY</text>
    </g>

    <!-- Main Pure Cotton Vest -->
    <g transform="translate(0, 10)">
      <!-- Back Neck -->
      <path d="M 170 80 Q 240 130 310 80 L 370 100 L 400 220 Q 350 300 350 380 L 350 560 L 130 560 L 130 380 Q 130 300 80 220 L 110 100 Z" fill="#E2E8F0" />
      <!-- Front Body -->
      <path d="M 170 80 Q 240 210 310 80 L 360 95 Q 370 190 350 280 Q 330 330 340 400 L 345 560 Q 240 568 135 560 L 140 400 Q 150 330 130 280 Q 110 190 120 95 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <!-- Ribbed Neck Binding -->
      <path d="M 170 80 Q 240 210 310 80 Q 318 82 316 90 Q 240 224 164 90 Q 162 82 170 80 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
      <!-- Armhole Bindings -->
      <path d="M 120 95 Q 110 190 130 280 Q 124 283 120 272 Q 102 185 110 93 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
      <path d="M 360 95 Q 370 190 350 280 Q 356 283 360 272 Q 378 185 370 93 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    </g>
  </g>
</svg>
